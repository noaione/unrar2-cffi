name: Build

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  pull_request:
    branches:
      - master
      - develop

env:
  UNRAR_VERSION: 7.0.9
  UNRAR_REV: 2d5ca9c3701925ecfcb097d263158adf911b23dd
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871

      - name: Install Python
        uses: actions/setup-python@19dfb7b659fa9e60c2f89c33335ab5f6f1792b6e
        with:
          python-version: "3.10"

      - name: Set up unrar
        run: |
          git clone https://github.com/pmachapman/unrar.git unrarsrc
          cd unrarsrc
          git checkout ${UNRAR_REV}
          rm -rf .git
          cd ..

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist .
          ls -l dist

      - uses: actions/upload-artifact@184d73b71b93c222403b2e7f1ffebe4508014249
        with:
          name: unrar2-cffi-sdist
          path: ./dist/unrar2_cffi-*.tar.gz

  build_wheels:
    strategy:
      fail-fast: false
      matrix:
        # Copied from numpy
        buildplat:
          - [ubuntu-24.04, manylinux_x86_64]
          - [ubuntu-24.04, musllinux_x86_64]
          - [macos-13, macosx_x86_64]
          - [macos-14, macosx_arm64]
          - [windows-2025, win_amd64]
          - [windows-2025, win32]

    runs-on: ${{ matrix.buildplat[0] }}
    env:
      IS_32_BIT: ${{ matrix.buildplat[1] == 'win32' }}

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871

      - name: Setup Python
        uses: actions/setup-python@19dfb7b659fa9e60c2f89c33335ab5f6f1792b6e
        with:
          python-version: "3.10"

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@719c55c4a5a93233ce33aa9366dc90396d60e0ee
        with:
          platforms: all

      - name: Setup MSVC (x64)
        if: runner.os == 'Windows' && matrix.buildplat[1] == 'win_amd64'
        uses: TheMrMilchmann/setup-msvc-dev@fb19abb8a41b3cf0340f5d1be17d420309232be6
        with:
          arch: x64
          sdk: "10.0.22621.0"
          toolset: 14.0

      - name: Setup MSVC (x86)
        if: runner.os == 'Windows' && matrix.buildplat[1] == 'win32'
        uses: TheMrMilchmann/setup-msvc-dev@fb19abb8a41b3cf0340f5d1be17d420309232be6
        with:
          arch: x86
          sdk: "10.0.22621.0"
          toolset: 14.0
        env:
          VSCMD_DEBUG: 3

      - name: Set up unrar
        run: |
          git clone https://github.com/pmachapman/unrar.git unrarsrc
          cd unrarsrc
          git checkout ${UNRAR_REV}
          cd ..
        shell: bash

      - name: Build wheels
        uses: pypa/cibuildwheel@7940a4c0e76eb2030e473a5f864f291f63ee879b
        env:
          CIBW_PRERELEASE_PYTHONS: True
          CIBW_BUILD: "*-${{ matrix.buildplat[1] }}"
          # Do not build PyPy
          CIBW_SKIP: "pp*"
          # Test
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests -vvv"
          CIBW_BUILD_VERBOSITY: 1
          # CIBW_FREE_THREADED_SUPPORT: 1

      - name: Move wheels
        run: |
          mkdir -p dist
          mv wheelhouse/*.whl dist/
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@184d73b71b93c222403b2e7f1ffebe4508014249
        with:
          name: unrar2-cffi-${{ matrix.buildplat[1] }}
          path: |
            dist/*.whl

  publish:
    name: Publish
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-24.04
    # Run only if tag is present
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871

      - name: Setup Python
        uses: actions/setup-python@19dfb7b659fa9e60c2f89c33335ab5f6f1792b6e
        with:
          python-version: "3.10"

      - name: Download artifacts
        uses: actions/download-artifact@d0ce8fd1167ed839810201de977912a090ab10a7
        with:
          path: dist
          pattern: unrar2-cffi-*
          merge-multiple: true

      - name: Publish PyPi
        uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597

      - name: Create changelog
        id: prepare-change
        run: |
          python3 tools/create_changelog.py
          # Fetch git tag contents subject
          VERSION_SUBJ=$(git tag -l --format='%(contents:subject)' ${{ github.ref }})
          echo "version_subject=$VERSION_SUBJ" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ github.ref }}

      - name: Release
        uses: softprops/action-gh-release@67b6c38432c171b8aa64dc6f3f152d12da2d99fa
        with:
          files: |
            dist/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG-GENERATED.md
          name: ${{ steps.prepare-change.outputs.version_subject }}
